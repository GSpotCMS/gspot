name: Feature request
description: Idea for GSpot CMS
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Admin panel
        - MCP tools
        - CLI
        - Themes
        - Plugins
        - Docs
        - Other
